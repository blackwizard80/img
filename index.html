<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cloudinary Chat - Full Pro</title>
<style>
:root {
  --bg-color:#000;
  --text-color:#fff;
  --accent-color:#00ff66;
  --bubble-me:#0066ff;
  --bubble-other:#333;
}
body {
  margin:0; padding:0; background:var(--bg-color); color:var(--text-color); font-family:Arial,sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#messages {
  position: fixed; top:0; left:0; width:100%; height:calc(100vh - 80px);
  overflow-y:auto; padding:10px 10px 100px 10px; box-sizing:border-box;
  display:flex; flex-direction:column; gap:15px; /* Spacing between messages */
}

/* Control Bar */
#sendMsg {
  position: fixed; bottom:0; left:0; width:100%; background:#111;
  display:flex; align-items:center; justify-content: space-between;
  padding:10px 15px; box-sizing:border-box; z-index: 2000;
  border-top: 1px solid #333; height: 70px;
}
.left-controls { display:flex; gap:10px; width: 70%; }
.upload-btn {
  flex: 1; height:45px; background:#333; color:#fff; border:none; 
  border-radius:25px; font-size:13px; cursor:pointer; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
}
.circle-btn {
  width: 50px; height: 50px; border-radius: 50%; background: var(--accent-color); color: #000;
  border: none; font-size: 24px; display: flex; justify-content: center; align-items: center;
  cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,102,0.3); flex-shrink: 0;
}

/* Message Bubbles */
.outer {display:flex; flex-shrink:0; position:relative; width: 100%;}
.me,.notMe {
  padding:10px; border-radius:15px; max-width:85%; display:inline-block;
  word-wrap:break-word; position:relative; min-width: 80px;
  user-select: none;
}
.me {background:var(--bubble-me); color:#fff; text-align:right; margin-left:auto; border-bottom-right-radius: 2px;}
.notMe {background:var(--bubble-other); color:#fff; text-align:left; margin-right:auto; border-bottom-left-radius: 2px;}

.sender-name { font-size: 0.75em; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.8; }

/* Media & Files */
.mediaMsg { width:100%; height:auto; max-height:40vh; object-fit:cover; border-radius:10px; display:block; margin-top:5px; }
audio.mediaMsg { width: 240px; height: 40px; margin-top: 5px; outline: none; }
.file-card {
  background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; 
  display: flex; align-items: center; gap: 10px; margin-top: 5px;
  text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.2);
}
.file-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;}

.time {font-size:0.65em; color:rgba(255,255,255,0.6); margin-top:5px; text-align: right;}
.delete-btn { font-size: 10px; background: #ff4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; margin-top: 5px; }

/* Progress Bar */
.progress-container {background:#222; border-radius:5px; margin-top:5px; height:6px; overflow:hidden;}
.progress-bar {height:100%; background:var(--accent-color); width:0%;}
.progress-percent {font-size:10px; color:#ccc; display: block; text-align: center;}

/* Download Button Style (NEW) */
.download-btn {
  background: #333; color: var(--accent-color); border: 1px solid var(--accent-color); 
  padding: 5px 10px; border-radius: 5px; font-size: 11px; margin-top: 5px; 
  display: inline-block; text-decoration: none; cursor: pointer;
}

/* --- REACTION STYLES --- */
/* Overlay behind the menu */
.reaction-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.7); z-index: 2999; display:none;
}
/* Centered Menu */
.reaction-bar {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #222; padding: 20px; border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 3000;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
  width: 80%; max-width: 300px;
  border: 1px solid #444;
}
.reaction-bar span {
  font-size: 30px; cursor: pointer; text-align: center;
  transition: transform 0.1s;
}
.reaction-bar span:active { transform: scale(1.3); }

/* Reactions Display under message */
.reactions-container {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; justify-content: flex-end;
}
.notMe .reactions-container { justify-content: flex-start; }

.reaction-chip {
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 2px 8px; font-size: 11px; color: #fff;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.reaction-emoji { font-size: 14px; }
.reaction-user { font-weight: bold; color: #ccc; }

/* Fullscreen Modal */
#fullscreenModal {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:9999;
}
#fullscreenModal img, #fullscreenModal video { max-width:100%; max-height:100%; }
</style>
</head>
<body oncontextmenu="return false;"> 

<div id="messages"></div>

<div id="sendMsg">
  <div class="left-controls">
    <button class="upload-btn" id="imgUploadBtn">📷 Images</button>
    <button class="upload-btn" id="vidUploadBtn">🎥 Videos</button>
  </div>
  <button class="circle-btn" id="fileBtn">📁</button>
  
  <input type="file" id="imgUpload" style="display:none;" accept="image/*" multiple>
  <input type="file" id="vidUpload" style="display:none;" accept="video/*" multiple>
  <input type="file" id="fileUpload" style="display:none;" multiple>
</div>

<div id="fullscreenModal"></div>
<div id="reactionOverlay" class="reaction-overlay"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, set, remove, onChildAdded, onChildRemoved, onValue } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

const firebaseConfig = { apiKey:"AIzaSyDPhDXeo4Z5bTQxwpW-HTg1UmGFLaO14wY",
 authDomain:"blacki-a15b9.firebaseapp.com",
 databaseURL:"https://blacki-a15b9-default-rtdb.firebaseio.com",
 projectId:"blacki-a15b9",
 storageBucket:"blacki-a15b9.firebasestorage.app",
 messagingSenderId:"672500956723",
 appId:"1:672500956723:web:0b7433bb51ef07c86b2d46" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const cloudName = "dk34hm7pe";
const unsignedUploadPreset = "videonew";

let sender = sessionStorage.getItem("sender") || prompt("Enter your name:");
if(!sender) sender = "Guest";
sessionStorage.setItem("sender", sender);

const messagesDiv = document.getElementById("messages");
const imgUploadBtn = document.getElementById("imgUploadBtn");
const vidUploadBtn = document.getElementById("vidUploadBtn");
const fileBtn = document.getElementById("fileBtn");
const imgUpload = document.getElementById("imgUpload");
const vidUpload = document.getElementById("vidUpload");
const fileUpload = document.getElementById("fileUpload");
const fullscreenModal = document.getElementById("fullscreenModal");
const reactionOverlay = document.getElementById("reactionOverlay");

function scrollToBottom(){ setTimeout(()=>{ messagesDiv.scrollTop = messagesDiv.scrollHeight; }, 100); }

// ---- UPLOAD LOGIC ----
async function uploadToCloudinary(file,tempDiv){
  return new Promise((resolve,reject)=>{
    const progressBar=tempDiv.querySelector(".progress-bar");
    const percentSpan=tempDiv.querySelector(".progress-percent");
    const url=`https://api.cloudinary.com/v1_1/${cloudName}/auto/upload`;
    
    const xhr=new XMLHttpRequest();
    const formData=new FormData();
    formData.append("file",file);
    formData.append("upload_preset",unsignedUploadPreset);

    const startTime=Date.now();
    xhr.open("POST",url);
    xhr.upload.addEventListener("progress",e=>{
      if(e.lengthComputable){
        const percent=Math.round((e.loaded/e.total)*100);
        progressBar.style.width=percent+"%";
        percentSpan.textContent=`${percent}%`;
      }
    });
    xhr.onload=()=>{
        if(xhr.status === 200){
            const data=JSON.parse(xhr.responseText);
            resolve({url: data.secure_url, name: file.name});
        } else { reject("Upload failed"); }
    };
    xhr.onerror=()=>reject("Network error");
    tempDiv.querySelector(".cancel-btn").onclick = ()=>{xhr.abort();tempDiv.remove();};
    xhr.send(formData);
  });
}

function createTempBubble(name,type){
  const tempId="upload-"+Date.now();
  const div=document.createElement("div");div.classList.add("outer");div.id=tempId;
  div.innerHTML=`<div class="me">
    <span class="sender-name">${name}</span>
    <div style="font-size:12px;">Uploading ${type}...</div>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <span class="progress-percent">0%</span>
    <button class="cancel-btn" style="background:#555; border:none; color:white; font-size:10px; margin-top:5px; padding:3px 8px; border-radius:4px;">Cancel</button>
  </div>`;
  messagesDiv.appendChild(div);scrollToBottom();return div;
}

async function handleFiles(files, forcedType){
  for(let file of files){
    let type = forcedType;
    if(!type) {
        if(file.type.startsWith('image/')) type = 'image';
        else if(file.type.startsWith('video/')) type = 'video';
        else if(file.type.startsWith('audio/')) type = 'audio';
        else type = 'file';
    }

    const tempDiv=createTempBubble(sender,type);
    const uploadFile=async ()=>{
      try{
        let result = await uploadToCloudinary(file,tempDiv);
        let url = result.url;
        if(type==="video") url = url.replace("/upload/", "/upload/vc_auto,q_auto/");
        const timestamp=Date.now();
        await set(ref(db,"messages/"+timestamp),{
            sender, msg:url, type, fileName: result.name, time:new Date().toLocaleString()
        });
        tempDiv.remove();
      }catch(e){
        tempDiv.querySelector(".me").innerHTML=`<b>${sender}</b> Failed <button class="retry-btn">Retry</button>`;
        tempDiv.querySelector(".retry-btn").onclick = uploadFile;
      }
    };
    uploadFile();
  }
}

// ---- EVENT LISTENERS ----
imgUploadBtn.onclick = ()=>imgUpload.click();
imgUpload.onchange = ()=>handleFiles(Array.from(imgUpload.files),"image");
vidUploadBtn.onclick = ()=>vidUpload.click();
vidUpload.onchange = ()=>handleFiles(Array.from(vidUpload.files),"video");
fileBtn.onclick = ()=> fileUpload.click();
fileUpload.onchange = ()=> handleFiles(Array.from(fileUpload.files), null);

// ---- RENDER MESSAGES (UPDATED FOR DOWNLOAD) ----
onChildAdded(ref(db,"messages"),snapshot=>{
  const {sender:msgSender, msg, type, fileName, time, reactions}=snapshot.val();
  const isMe=msgSender===sender;
  let contentHTML="";
  // New Download button template
  let downloadButtonHTML = `<a href="${msg}" class="download-btn" target="_blank" download="${fileName || 'file'}">⬇️ Download</a>`;

  if(type==="image") contentHTML=`
    <img src="${msg}" class="mediaMsg" loading="lazy">
    ${downloadButtonHTML}
  `;
  else if(type==="video") contentHTML=`
    <video src="${msg}" class="mediaMsg" controls playsinline></video>
    ${downloadButtonHTML}
  `;
  else if(type==="audio") contentHTML=`
    <audio src="${msg}" class="mediaMsg" controls controlsList="nodownload"></audio>
    ${downloadButtonHTML}
  `;
  // File type already has a download link (file-card)
  else contentHTML=`<a href="${msg}" class="file-card" target="_blank" download="${fileName || 'File'}">
         <span style="font-size:24px">📄</span> <div><div class="file-name">${fileName||'File'}</div><div style="font-size:10px;color:#aaa;">Tap to download</div></div></a>`;

  const msgDiv=document.createElement("div");
  msgDiv.classList.add("outer");msgDiv.id=snapshot.key;
  msgDiv.innerHTML=`<div class="${isMe?"me":"notMe"}" data-key="${snapshot.key}">
    <span class="sender-name">${msgSender}</span>
    ${contentHTML}
    <div class="time">${time}</div>
    ${isMe?`<button class="delete-btn">Delete</button>`:""}
    <div class="reactions-container"></div>
  </div>`;
  
  messagesDiv.appendChild(msgDiv);
  scrollToBottom();
  
  if(reactions) renderReactions(msgDiv.querySelector(".reactions-container"), reactions);

  const delBtn = msgDiv.querySelector(".delete-btn");
  if(delBtn) delBtn.onclick = ()=> remove(ref(db,"messages/"+snapshot.key));
});

onChildRemoved(ref(db,"messages"),snapshot=>{
    const el=document.getElementById(snapshot.key); if(el) el.remove(); 
});

// Fullscreen
messagesDiv.addEventListener("click",e=>{
    if(e.target.tagName === "IMG" && e.target.classList.contains("mediaMsg")){
        fullscreenModal.style.display="flex";
        fullscreenModal.innerHTML = `<img src="${e.target.src}">`;
    }
});
fullscreenModal.onclick = ()=> { fullscreenModal.style.display="none"; };

// ---- REACTION SYSTEM (NEW CENTERED UI) ----
const reactionEmojis = ["👍","❤️","😂","😮","😢","🔥","🎉","💩","😡","👻","🙏","👎","🥺","🥹","🤤"];

let pressTimer;
let isLongPress = false;

// Handle Long Press
messagesDiv.addEventListener("touchstart", handleStart, {passive: false});
messagesDiv.addEventListener("mousedown", handleStart);
messagesDiv.addEventListener("touchend", handleEnd);
messagesDiv.addEventListener("mouseup", handleEnd);
messagesDiv.addEventListener("click", handleClick);

function handleStart(e){
    const bubble = e.target.closest(".me, .notMe");
    if(bubble){
        isLongPress = false;
        pressTimer = setTimeout(()=>{
            isLongPress = true;
            // No coordinates needed, we show it centered
            showCenteredReactionBar(bubble.getAttribute("data-key"));
            if(navigator.vibrate) navigator.vibrate(50);
        }, 600);
    }
}

function handleEnd(e){
    clearTimeout(pressTimer);
    if(isLongPress){ e.preventDefault(); e.stopPropagation(); }
}

function handleClick(e){
    if(isLongPress){ e.preventDefault(); e.stopPropagation(); isLongPress = false; }
}

function showCenteredReactionBar(msgKey){
    // Clean up old ones
    document.querySelectorAll(".reaction-bar").forEach(el=>el.remove());
    
    // Show Overlay
    reactionOverlay.style.display = "block";

    const bar = document.createElement("div");
    bar.className = "reaction-bar";
    
    reactionEmojis.forEach(emoji => {
        const btn = document.createElement("span");
        btn.textContent = emoji;
        btn.onclick = (e) => {
            e.stopPropagation();
            toggleReaction(msgKey, emoji);
            closeReactionBar();
        };
        bar.appendChild(btn);
    });

    document.body.appendChild(bar);
    
    // Close on overlay click
    reactionOverlay.onclick = closeReactionBar;
}

function closeReactionBar(){
    document.querySelectorAll(".reaction-bar").forEach(el=>el.remove());
    reactionOverlay.style.display = "none";
}

function toggleReaction(msgKey, emoji){
    const reactionRef = ref(db, `messages/${msgKey}/reactions/${sender}`);
    onValue(reactionRef, snap => {
        const val = snap.val();
        if(val && val.emoji === emoji){ set(reactionRef, null); } // Remove
        else { set(reactionRef, {emoji, by: sender}); } // Set new
    }, {onlyOnce: true});
}

// Live Updates
onValue(ref(db,"messages"), snapshot => {
    snapshot.forEach(child => {
        const msgEl = document.getElementById(child.key);
        if(msgEl){
            renderReactions(msgEl.querySelector(".reactions-container"), child.val().reactions);
        }
    });
});

// Render List of Names + Emojis
function renderReactions(container, reactions){
    if(!container) return;
    container.innerHTML = "";
    if(!reactions) return;

    // Iterate through all reactions (reaction ID -> data)
    Object.values(reactions).forEach(r => {
        if(!r.emoji || !r.by) return;
        
        const chip = document.createElement("div");
        chip.className = "reaction-chip";
        // Show Name + Emoji
        chip.innerHTML = `<span class="reaction-user">${r.by}</span> <span class="reaction-emoji">${r.emoji}</span>`;
        
        container.appendChild(chip);
    });
}

</script>
</body>
</htm>
